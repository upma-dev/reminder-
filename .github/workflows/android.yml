name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Secrets are never in git. Add them in GitHub: Settings -> Secrets and variables -> Actions
      #   GOOGLE_SERVICES_JSON   = the full text of app/google-services.json
      #   DEBUG_KEYSTORE_BASE64  = base64 of your debug.keystore (keeps the SHA-1 stable for OTP/Google login)
      #   ENV_FILE               = (optional) full text of your .env
      - name: Restore private files
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore; fi
          if [ -n "$ENV_FILE" ]; then printf '%s' "$ENV_FILE" > .env; fi

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Prepare APK at root
        run: cp app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cute-Reminder-App-APK
          path: app-debug.apk
